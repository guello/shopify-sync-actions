name: Monitor Sync

on:
  workflow_run:
    workflows: [Sync Products, Sync Collections]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: monitor-sync
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check sync health
        run: node .github/scripts/monitor-sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_FAILURE_THRESHOLD: ${{ vars.SYNC_FAILURE_THRESHOLD }}
