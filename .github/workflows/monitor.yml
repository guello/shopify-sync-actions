name: Monitor

on:
  workflow_run:
    workflows: [Sync Products, Sync Collections]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    concurrency:
      group: monitor
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Check sync health
        run: node .github/scripts/monitor.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_FAILURE_THRESHOLD: ${{ vars.SYNC_FAILURE_THRESHOLD }}

  keep-alive:
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: 'chore(actions): automated commit'
